name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      JWT_SECRET: "ci-test-secret-please-do-not-use-in-production-0123456789"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: python -m ruff check .

      - name: Compile
        run: python -m compileall -q backend evaluation demo

      - name: Test
        run: python -m pytest -q

      # 前端三个回归脚本是纯 node 跑的，pytest 收不到它们：
      # 不单独跑的话，markdown 转义 / 导航 / 分页坏了 CI 也全绿。
      - name: Frontend syntax check
        run: |
          for f in backend/static/js/*.js backend/static/js/views/*.js backend/static/sw.js; do
            node --check "$f"
          done

      - name: Frontend tests
        run: |
          node tests/frontend_markdown.mjs
          node tests/frontend_navigation.mjs
          node tests/frontend_pagination.mjs
