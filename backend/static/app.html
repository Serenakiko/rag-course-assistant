<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智答系统</title>
  <link rel="stylesheet" href="/static/css/common.css?v=23">
  <link rel="stylesheet" href="/static/css/app.css?v=64">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div class="app-shell">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <img class="brand-mark" src="/static/img/logo.svg" alt="" width="26" height="26">
        <div class="logo-text">智答系统</div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-user">
        <div class="sidebar-user-row">
          <div class="avatar" id="user-avatar"><span>?</span></div>
          <div class="sidebar-user-info">
            <div class="u-name" id="user-name">-</div>
            <div class="u-role" id="user-role">学生</div>
          </div>
          <button type="button" class="logout-btn" id="logout-btn" title="退出登录" aria-label="退出登录">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9"/><path d="M6.6 6.6a8 8 0 1 0 10.8 0"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <div class="main-area">
      <header class="main-header">
        <div class="header-left">
          <button type="button" class="nav-toggle" id="nav-toggle" aria-label="打开菜单" aria-expanded="false" aria-controls="sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
          </button>
          <h1 id="page-title">智能问答</h1>
        </div>
      </header>
      <main class="main-content" id="main-content" tabindex="-1"></main>
    </div>
  </div>

  <div class="nav-backdrop" id="nav-backdrop"></div>

  <!-- 弹窗容器 -->
  <div class="modal-mask" id="modal-mask">
    <div class="modal" id="modal-box"></div>
  </div>

  <div id="toast-root"></div>

  <script src="/static/js/common.js?v=22"></script>
  <script src="/static/js/api.js?v=19"></script>
  <script src="/static/js/markdown.js?v=20"></script>
  <script src="/static/js/views/chat.js?v=29"></script>
  <script src="/static/js/views/knowledge.js?v=40"></script>
  <script src="/static/js/views/workbench.js?v=37"></script>
  <script src="/static/js/views/history.js?v=19"></script>
  <script src="/static/js/views/documents.js?v=31"></script>
  <script src="/static/js/views/admin.js?v=68"></script>
  <script src="/static/js/views/feedback.js?v=15"></script>
  <script src="/static/js/views/profile.js?v=39"></script>
  <script src="/static/js/app.js?v=33"></script>
</body>
</html>
