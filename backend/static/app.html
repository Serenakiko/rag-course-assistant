<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17505e">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <title>智答系统</title>
  <script src="/static/js/theme-boot.js?v=1"></script>
  <link rel="stylesheet" href="/static/css/common.css?v=30">
  <link rel="stylesheet" href="/static/css/app.css?v=108">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div class="app-shell">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <img class="brand-mark" src="/static/img/logo.svg" alt="" width="26" height="26">
        <div class="logo-text">智答系统</div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-user">
        <div class="sidebar-user-row">
          <button type="button" class="sidebar-user-link" id="user-profile-btn" title="进入个人中心" aria-label="进入个人中心">
            <span class="avatar" id="user-avatar"><span>?</span></span>
            <span class="sidebar-user-info">
              <span class="u-name" id="user-name">-</span>
              <span class="u-role" id="user-role">学生</span>
            </span>
          </button>
          <button type="button" class="logout-btn" id="logout-btn" title="退出登录" aria-label="退出登录">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9"/><path d="M6.6 6.6a8 8 0 1 0 10.8 0"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <div class="main-area">
      <header class="main-header">
        <div class="header-left">
          <button type="button" class="nav-toggle" id="nav-toggle" aria-label="打开菜单" aria-expanded="false" aria-controls="sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
          </button>
          <h1 id="page-title">智能问答</h1>
        </div>
        <div class="header-right" id="header-right">
          <button type="button" class="notify-btn theme-btn" id="theme-btn" aria-label="切换深浅色主题" title="切换深浅色主题"></button>
          <span id="header-notify"></span>
        </div>
      </header>
      <main class="main-content" id="main-content" tabindex="-1"></main>
    </div>
  </div>

  <div class="nav-backdrop" id="nav-backdrop"></div>

  <!-- 弹窗容器 -->
  <div class="modal-mask" id="modal-mask">
    <div class="modal" id="modal-box"></div>
  </div>

  <div id="toast-root"></div>

  <script src="/static/js/common.js?v=29" defer></script>
<script src="/static/js/api.js?v=26" defer></script>
  <script src="/static/js/markdown.js?v=21" defer></script>
<script src="/static/js/views/chat.js?v=48" defer></script>
  <script src="/static/js/views/knowledge.js?v=52" defer></script>
  <script src="/static/js/views/workbench.js?v=49" defer></script>
  <script src="/static/js/views/history.js?v=29" defer></script>
  <script src="/static/js/views/documents.js?v=46" defer></script>
  <script src="/static/js/views/content.js?v=1" defer></script>
  <script src="/static/js/views/recycle.js?v=6" defer></script>
  <script src="/static/js/views/courses.js?v=2" defer></script>
  <script src="/static/js/views/admin-feedback.js?v=6" defer></script>
  <script src="/static/js/views/admin.js?v=100" defer></script>
  <script src="/static/js/views/feedback.js?v=24" defer></script>
  <script src="/static/js/views/notifications.js?v=2" defer></script>
  <script src="/static/js/views/export-share.js?v=9" defer></script>
  <script src="/static/js/views/shares.js?v=3" defer></script>
  <script src="/static/js/views/search-debug.js?v=2" defer></script>
  <script src="/static/js/views/profile.js?v=41" defer></script>
  <script src="/static/js/app.js?v=55" defer></script>
  <!-- 移动端抽屉兜底：app.js 已内置同款逻辑，这里只在它没绑定/未生效时才切换，避免双触发 -->
  <script src="/static/js/nav-drawer-boot.js?v=1" defer></script>
  <!-- PWA：注册 Service Worker（/api/ 请求直连，不进缓存） -->
  <script src="/static/js/sw-boot.js?v=1" defer></script>
</body>
</html>
