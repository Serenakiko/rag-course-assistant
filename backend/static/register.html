<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 智答系统</title>
  <link rel="stylesheet" href="/static/css/common.css?v=13">
  <link rel="stylesheet" href="/static/css/auth.css?v=10">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="title">智答系统</div>
      </div>

      <form id="register-form" class="auth-form" autocomplete="on" novalidate>
        <div class="form-group">
          <label for="reg-realname">用户名</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <circle cx="8.5" cy="10" r="2"/>
              <path d="M5.5 16.5c.6-2 1.7-3 3-3s2.4 1 3 3"/>
              <path d="M14 9.5h5M14 13.5h5"/>
            </svg>
            <input id="reg-realname" class="form-control" name="real_name" placeholder="请输入用户名" maxlength="32" autocomplete="name">
          </div>
        </div>
        <div class="form-group">
          <label for="reg-username">账号</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input id="reg-username" class="form-control" name="username" placeholder="请输入 8 位数字账号" maxlength="8" inputmode="numeric" autocomplete="username" required>
          </div>
        </div>
        <div class="form-group">
          <label for="reg-password">密码</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input id="reg-password" class="form-control" name="password" type="password" placeholder="请输入密码（至少 6 位）" minlength="6" maxlength="64" autocomplete="new-password" required>
            <button type="button" class="eye-toggle" data-target="reg-password" tabindex="-1" aria-label="显示密码">
              <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="reg-confirm">确认密码</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input id="reg-confirm" class="form-control" name="confirm_password" type="password" placeholder="请再次输入密码" minlength="6" maxlength="64" autocomplete="new-password" required>
            <button type="button" class="eye-toggle" data-target="reg-confirm" tabindex="-1" aria-label="显示密码">
              <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="register-btn">
          <span class="btn-label">注 册</span>
        </button>
        <div class="auth-switch">已有账号？<a href="index.html" class="switch-link">立即登录</a></div>
      </form>
    </div>
  </div>

  <div class="modal-mask" id="modal-mask">
    <div class="modal" id="modal-box"></div>
  </div>

  <div id="toast-root"></div>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
