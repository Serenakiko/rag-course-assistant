<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 智答系统</title>
  <link rel="stylesheet" href="/static/css/common.css?v=5">
  <link rel="stylesheet" href="/static/css/auth.css?v=5">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="title">智答系统</div>
      </div>

      <form id="login-form" class="auth-form" autocomplete="on">
        <div class="form-group">
          <label for="login-username">账号</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input id="login-username" class="form-control" name="username" placeholder="请输入账号" maxlength="8" inputmode="numeric" autocomplete="username" required>
          </div>
        </div>
        <div class="form-group">
          <label for="login-password">密码</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input id="login-password" class="form-control" name="password" type="password" placeholder="请输入密码" minlength="6" autocomplete="current-password" required>
            <button type="button" class="eye-toggle" data-target="login-password" tabindex="-1" aria-label="显示密码">
              <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="login-btn">
          <span class="btn-label">登 录</span>
        </button>
        <div class="auth-switch">没有账号？<a href="register.html" class="switch-link">立即注册</a></div>
      </form>
    </div>
  </div>

  <div id="toast-root"></div>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
